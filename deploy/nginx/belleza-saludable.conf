# Configuración de Nginx para Belleza Saludable
#
# REEMPLAZA las tres líneas que dicen "TU_DOMINIO" por las que pongas en producción.
# El dashboard y el panel del admin se sirven directamente desde la app en Node en el puerto 3000.

server {
    # 1) Dominio principal (portal de clientes / React)
    server_name TU_DOMINIO www.TU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }

    listen 443 ssl http2;
    # Los certificados los genera Certbot. No los toques a mano:
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirigir HTTP -> HTTPS (lo auto-genera Certbot)
server {
    if ($host = www.TU_DOMINIO) {
        return 301 https://$host$request_uri;
    }
    if ($host = TU_DOMINIO) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;
    return 404;
}
