# Configuración de Nginx para HairStyle Abii
#
# REEMPLAZA las tres líneas que dicen "TU_DOMINIO" por tu dominio real.
# La app corre en Node en el puerto 3000 y sirve tanto el frontend (React)
# como las páginas HTML (/panel.html, /admin.html, /cliente.html, etc.)
# y las imágenes en /fotos desde el filesystem del server.

server {
    server_name TU_DOMINIO www.TU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.TU_DOMINIO) {
        return 301 https://$host$request_uri;
    }
    if ($host = TU_DOMINIO) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;
    return 404;
}
